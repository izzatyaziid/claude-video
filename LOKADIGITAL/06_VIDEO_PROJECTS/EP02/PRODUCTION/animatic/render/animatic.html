<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"JBM";src:url(../../../ASSETS/STYLE_FRAMES/src/fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(../../../ASSETS/STYLE_FRAMES/src/fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2");font-weight:600}

</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
// LOKADIGITAL EP02 — ANIMATIC v1 renderer. renderFrame(t) draws one frame at time t (s).
// Visual language = approved style frames v2 (benchmark). Timing = beatmap.json (single source).
const W=1080,H=1920;
const C={ink:'#05030A',p1:'#602AC8',p2:'#301270',y:'#E8FF2B',lav:'#AB94FF',mist:'#D4CAF2',grey:'#7C7396',white:'#F4F1FF'};
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let E={}, BEATS=[];

// ---------- utils
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const cl=x=>Math.max(0,Math.min(1,x)), P=(t,a,b)=>cl((t-a)/(b-a));
const eo=x=>1-Math.pow(1-cl(x),3), ei=x=>Math.pow(cl(x),3), eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}, ex=x=>x>=1?1:1-Math.pow(2,-10*cl(x));
const lerp=(a,b,u)=>a+(b-a)*u;
function hexA(h,a){const n=parseInt(h.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`;}
function mix(h1,h2,t){const a=parseInt(h1.slice(1),16),b=parseInt(h2.slice(1),16);const f=(s)=>Math.round(((a>>s)&255)*(1-t)+((b>>s)&255)*t);return '#'+[f(16),f(8),f(0)].map(v=>v.toString(16).padStart(2,'0')).join('');}
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return [c,c.getContext('2d')];}

// ---------- human silhouette library (same shape as style frames v2)
function inside(x,y){const hx=x/0.165,hy=(y+0.55)/0.195;if(hx*hx+hy*hy<=1)return true;if(y>-0.38&&y<-0.26&&Math.abs(x)<0.075)return true;
  if(y>=-0.3&&y<=0.6){let hw;if(y<-0.05){const t=(y+0.3)/0.25;hw=0.08+0.38*Math.sqrt(Math.max(0,1-(1-t)*(1-t)));}else hw=0.46-0.07*((y+0.05)/0.65);return Math.abs(x)<=hw;}return false;}
function samplePerson(r,n){const pts=[];let g=0;while(pts.length<n&&g++<n*60){const x=(r()*2-1)*0.52,y=-0.76+r()*1.36;if(!inside(x,y))continue;const e=0.03;const edge=!inside(x+e,y)||!inside(x-e,y)||!inside(x,y+e)||!inside(x,y-e);
  const fb=y>0.25?(0.6-y)/0.35:1;if(r()>(edge?1:0.32)*fb)continue;pts.push([x,y,edge?1:0,r(),r()]);}return pts;}
const LIB=[0,1,2,3,4,5].map(i=>samplePerson(rng(600+i),700));
const HERO=samplePerson(rng(77),1100);

// dots: fast path
function dots(x2,person,cx,gy,s,o){
  const pts=o.pts||LIB[person.k||0]; const blur=o.blur||0;
  let n=Math.min(pts.length,Math.max(4,Math.round((o.density||3)*s*Math.min(1,Math.pow(s/160,0.9))/(1+blur/5))));
  const step=pts.length/n, rot=o.rot||0, cr=Math.cos(rot), sr=Math.sin(rot); const rr=Math.max(0.6,o.r||s*0.005)+blur*0.5;
  const al=o.alpha/(1+blur/9);
  for(let i=0;i<n;i++){const p=pts[Math.floor(i*step)];let px=p[0],py=p[1]-0.6;let X=cx+(px*cr-py*sr)*s,Y=gy+(px*sr+py*cr)*s;
    if(o.burst){const b=o.burst; X=lerp(b[0],X,b[2]+(1-b[2])*Math.min(1,p[3]*0.4+b[2]*0.6)); Y=lerp(b[1],Y,b[2]+(1-b[2])*Math.min(1,p[3]*0.4+b[2]*0.6));}
    if(o.conv){const k=o.conv; const a=p[4]*6.283; X+=Math.cos(a)*k*(120+p[3]*260); Y+=Math.sin(a)*k*(120+p[3]*260);}
    x2.globalAlpha=al*(p[2]?1:0.55)*(o.aFn?o.aFn(p):1); x2.fillStyle=o.colFn?o.colFn(p):o.col;
    if(rr<1.6) x2.fillRect(X-rr,Y-rr,rr*2,rr*2); else {x2.beginPath();x2.arc(X,Y,rr,0,6.283);x2.fill();}
    if(o.streak){x2.fillRect(X-o.streak,Y-0.4,o.streak,0.8);}
  }
  x2.globalAlpha=1;
}

// ---------- static textures: fog, vignette, grain
let FOG,VIG,GRAIN=[];
function buildTextures(){
  const fw=108,fh=192;const [fc,f]=mk(fw,fh);const id=f.createImageData(fw,fh);const r=rng(11);const grid=[];for(let i=0;i<1600;i++)grid.push(r());
  const vn=(x,y)=>{const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;const g=(a,b)=>grid[((a%40+40)%40)+((b%40+40)%40)*40];const sm=t=>t*t*(3-2*t);const a=g(xi,yi),b=g(xi+1,yi),c=g(xi,yi+1),d=g(xi+1,yi+1);return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf);};
  for(let y=0;y<fh;y++)for(let x=0;x<fw;x++){let v=0,amp=.55,fr=.035;for(let o=0;o<4;o++){v+=amp*vn(x*fr,y*fr);amp*=.5;fr*=2;}const k=(y*fw+x)*4;const t=Math.max(0,v-.42)*1.5;id.data[k]=96*t;id.data[k+1]=42*t;id.data[k+2]=200*t;id.data[k+3]=255;}
  f.putImageData(id,0,0);[FOG]=mk(W+200,H+200);const fx=FOG.getContext('2d');fx.filter='blur(18px)';fx.drawImage(fc,0,0,W+200,H+200);
  [VIG]=mk(W,H);const v=VIG.getContext('2d');const g=v.createRadialGradient(W/2,H*.52,H*.25,W/2,H*.52,H*.78);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.78)');v.fillStyle=g;v.fillRect(0,0,W,H);
  for(let k=0;k<4;k++){const [gc,gx]=mk(540,960);const d=gx.createImageData(540,960);const rr=rng(900+k);for(let i=0;i<d.data.length;i+=4){const q=128+(rr()+rr()+rr()-1.5)*90;d.data[i]=d.data[i+1]=d.data[i+2]=q;d.data[i+3]=255;}gx.putImageData(d,0,0);GRAIN.push(gc);}
}
const [GL,g]=mk(W,H); const [SM,sm]=mk(270,480); const [PL,pl]=mk(W,H);
function bg(lights,fog,t){ctx.fillStyle=C.ink;ctx.fillRect(0,0,W,H);
  for(const L of lights){const gr=ctx.createRadialGradient(L[0],L[1],0,L[0],L[1],L[2]);gr.addColorStop(0,hexA(L[3],L[4]));gr.addColorStop(1,hexA(L[3],0));ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);}
  ctx.save();ctx.globalCompositeOperation='screen';ctx.globalAlpha=fog;ctx.drawImage(FOG,-100+Math.sin(t*0.05)*60,-100+Math.cos(t*0.04)*50);ctx.restore();}
function beginLayers(){g.setTransform(1,0,0,1,0,0);g.clearRect(0,0,W,H);pl.setTransform(1,0,0,1,0,0);pl.clearRect(0,0,W,H);}
function composeParticles(a=1){ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a;ctx.drawImage(PL,0,0);ctx.restore();}
function bloom(a1=.55,a2=.7){sm.clearRect(0,0,270,480);sm.filter='blur(10px)';sm.drawImage(GL,0,0,270,480);sm.filter='none';
  ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a1;ctx.drawImage(SM,0,0,W,H);ctx.globalAlpha=1;ctx.drawImage(GL,0,0);ctx.restore();
  sm.clearRect(0,0,270,480);sm.filter='blur(3px)';sm.drawImage(GL,0,0,270,480);sm.filter='none';ctx.save();ctx.globalCompositeOperation='lighter';ctx.globalAlpha=a2*0.6;ctx.drawImage(SM,0,0,W,H);ctx.restore();}
function finish(fr){ctx.drawImage(VIG,0,0);ctx.save();ctx.globalCompositeOperation='overlay';ctx.globalAlpha=.11;ctx.drawImage(GRAIN[fr%4],0,0,W,H);ctx.restore();}

// ---------- signal line / flare
function flare(x2,x,y,k){let gr=x2.createRadialGradient(x,y,0,x,y,26*k);gr.addColorStop(0,'rgba(255,255,245,1)');gr.addColorStop(.25,hexA(C.y,.9));gr.addColorStop(1,hexA(C.y,0));x2.fillStyle=gr;x2.beginPath();x2.arc(x,y,26*k,0,7);x2.fill();
  x2.save();x2.translate(x,y);x2.scale(1,.018);gr=x2.createRadialGradient(0,0,0,0,0,420*k);gr.addColorStop(0,hexA('#FFFFF0',.95));gr.addColorStop(.15,hexA(C.y,.5));gr.addColorStop(1,hexA(C.y,0));x2.fillStyle=gr;x2.beginPath();x2.arc(0,0,420*k,0,7);x2.fill();x2.restore();}
function catmull(pts,seg){const out=[];for(let i=0;i<pts.length-1;i++){const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];for(let t=0;t<seg;t++){const u=t/seg,u2=u*u,u3=u2*u;
  out.push([.5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),.5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)]);}}out.push(pts[pts.length-1]);return out;}
// draw a path up to fraction `prog`; returns head point
function sline(x2,pts,prog,o={}){const P_=catmull(pts,20);const n=Math.max(2,Math.floor(P_.length*cl(prog)));const w=o.w||3;const a=o.alpha==null?1:o.alpha;
  x2.lineCap='round';x2.strokeStyle=hexA(o.col||C.y,a);x2.lineWidth=w*1.8;x2.beginPath();for(let i=0;i<n;i++)i?x2.lineTo(P_[i][0],P_[i][1]):x2.moveTo(P_[i][0],P_[i][1]);x2.stroke();
  if(!o.noCore){x2.strokeStyle=hexA('#FFFFF0',.9*a);x2.lineWidth=w*.55;x2.stroke();}
  const h=P_[n-1];if(o.head!==false&&prog>0.01&&prog<0.999)flare(x2,h[0],h[1],o.flare||.6);if(o.headAlways)flare(x2,h[0],h[1],o.flare||.6);return {head:h,pts:P_};}

// ---------- typography
const F_D=(w,s)=>`${w} ${s}px "Inter Display"`, F_M=(w,s)=>`${w} ${s}px JBM`;
function tw(s,font,ls){ctx.save();ctx.font=font;ctx.letterSpacing=ls||'0px';const m=ctx.measureText(s).width;ctx.restore();return m;}
// words: [[text,color,glow]] drawn in sequence; p = masked-rise progress; out = exit progress (moves up, fades, blurs)
function line(words,x,y,size,weight,o={}){
  const p=o.p==null?1:o.p,out=o.out||0;if(p<=0||out>=1)return 0;const font=F_D(weight,size),ls=o.ls||`${-size*0.035}px`;
  const dy=(1-eo(p))*size*0.95-eo(out)*size*1.6;const alpha=(o.alpha==null?1:o.alpha)*(1-out);
  let cx=x;const total=words.reduce((a,w)=>a+tw(w[0],font,ls),0);if(o.align==='center')cx=x-total/2;
  const x0=cx;
  for(const [s,col,glow] of words){for(const L of [ctx].concat(glow?[g]:[])){L.save();L.font=font;L.letterSpacing=ls;L.globalAlpha=alpha;
      if(p<1){L.beginPath();L.rect(cx-30,y-size*1.05,4000,size*1.32);L.clip();}
      if(out>0&&L===ctx)L.filter=`blur(${out*6}px)`;
      if(o.shake){L.translate(o.shake[0],o.shake[1]);}
      L.fillStyle=col;L.fillText(s,cx,y+dy);L.restore();}
    cx+=tw(s,font,ls);}
  return {x0,w:cx-x0};}
function uline(x,y,w,p,glow=true){if(p<=0)return;const e=x+w*eo(p);for(const L of [ctx].concat(glow?[g]:[])){L.strokeStyle=C.y;L.lineWidth=7;L.lineCap='butt';L.beginPath();L.moveTo(x,y);L.lineTo(e,y);L.stroke();}if(p<1)flare(g,e,y,.55);}
function mono(s,x,y,size,col,o={}){const p=o.p==null?1:o.p;const n=Math.floor(s.length*cl(p));if(n<=0)return;ctx.save();ctx.font=F_M(o.w||600,size);ctx.letterSpacing=o.ls||`${size*0.24}px`;ctx.textAlign=o.align||'left';ctx.globalAlpha=o.alpha==null?1:o.alpha;ctx.fillStyle=col;ctx.fillText(s.slice(0,n),x,y);ctx.restore();}
function strike(x,y,w,p){if(p<=0)return;const e=x+w*eo(p);for(const L of [ctx,g]){L.strokeStyle=C.y;L.lineWidth=6;L.beginPath();L.moveTo(x-10,y);L.lineTo(e+10,y);L.stroke();}flare(g,e+10,y,.5);}
function title3d(s,t,t0,t1){const u=P(t,t0,t1);if(u<=0||u>=1)return;const sc=0.55*Math.pow(14,ei(u));const a=u<.15?u/.15:(u>.55?Math.max(0,1-(u-.55)/.35):1);
  ctx.save();ctx.translate(W/2,H*0.47);ctx.scale(sc,sc);ctx.font=F_D(800,120);ctx.letterSpacing='-4px';ctx.textAlign='center';ctx.globalAlpha=a;ctx.fillStyle=C.white;ctx.fillText(s.split(' ')[1],0,40);
  ctx.font=F_M(600,28);ctx.letterSpacing='8px';ctx.fillStyle=C.y;ctx.fillText('BAB '+s.split(' ')[0],0,-90);ctx.restore();}
function chip(s,x,y,a,sc=1,col){if(a<=0)return;ctx.save();ctx.translate(x,y);ctx.scale(sc,sc);ctx.globalAlpha=a;ctx.font=F_M(600,24);ctx.letterSpacing='5px';const w=ctx.measureText(s).width+40;
  ctx.fillStyle='rgba(18,10,36,0.75)';ctx.fillRect(-w/2,-26,w,52);ctx.strokeStyle=col||hexA(C.lav,.7);ctx.lineWidth=1.5;ctx.strokeRect(-w/2,-26,w,52);ctx.fillStyle=col||C.mist;ctx.textAlign='center';ctx.fillText(s,0,9);ctx.restore();}

// ---------- Signal Rail (y220-290)
const RX0=96,RX1=W-176,RY=255;const RXS=[RX0,(RX0+RX1)/2,RX1];const RL=['CARI','CAKAP','SAMBUNG'];
function rail(t,done,active,a=1){if(a<=0)return;ctx.save();ctx.globalAlpha=a;g.save();g.globalAlpha=a;
  ctx.strokeStyle=hexA(C.lav,.35);ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(RX0,RY);ctx.lineTo(RX1,RY);ctx.stroke();
  const fillTo=RXS[0]+(RXS[2]-RXS[0])*done;g.strokeStyle=C.y;g.lineWidth=2.5;g.beginPath();g.moveTo(RX0,RY);g.lineTo(fillTo,RY);g.stroke();
  RL.forEach((l,i)=>{const x=RXS[i];const isDone=done*2>=i&&i<active,isAct=i===active;
    if(isDone){g.fillStyle=C.y;g.beginPath();g.arc(x,RY,8,0,7);g.fill();}
    else if(isAct){const pu=1+0.25*Math.sin(t*6);g.strokeStyle=C.y;g.lineWidth=2.5;g.beginPath();g.arc(x,RY,13*pu,0,7);g.stroke();g.fillStyle=C.y;g.beginPath();g.arc(x,RY,5,0,7);g.fill();}
    else{ctx.strokeStyle=hexA(C.lav,.55);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(x,RY,7,0,7);ctx.stroke();}
    mono(`0${i+1} ${l}`,x,RY+46,21,i<=active?C.mist:hexA(C.lav,.6),{ls:'5px',align:i===0?'left':(i===2?'right':'center')});});
  ctx.restore();g.restore();}

// ---------- WORLD A: crowd at eye level (S01–S04) — layered like SF1 v2
const WA=[];(function(){const r=rng(101);const LAYERS=[[6,9,9],[10,16,18],[18,30,30],[34,55,44],[60,95,60],[96,130,50]];
  for(const [z0,z1,n] of LAYERS)for(let i=0;i<n;i++){const z=z0+r()*(z1-z0);const u=(i+.5+(r()-.5)*.8)/n;WA.push({X:(-0.44+0.88*u)*z*1.25,Z:z+2.2,k:Math.floor(r()*6),fit:r()});}
  WA.push({X:-0.62*2.3,Z:2.3+2.2,k:1,fit:.1},{X:0.66*2.6,Z:2.6+2.2,k:4,fit:.1});})();
const HEROP={X:-0.83,Z:6.6};      // hero world position (≈ SF1 v2 screen position at 6.2 s)
const CLU=[];(function(){const r=rng(55);const base=[[0.9,9.6],[1.5,10.4],[0.3,10.6],[1.15,11.6],[1.9,11.2],[0.55,12.1],[2.3,12.4],[1.45,12.9]];
  base.forEach(([x,z],i)=>CLU.push({X:x+(r()-.5)*.1,Z:z+5,k:i%6,ci:i}));})();
function camA(t){ // camera path S01–S04
  const s03=E.s03,s04=E.s04;let camZ=0,camX=0,hor=1000,F=1500,camH=2.0;
  const push=eio(P(t,E.push,E.s02));camZ=2.1*push;
  if(t>=E.s02){camZ=2.1+1.2*eio(P(t,E.s02,E.s03));}
  if(t>=s03){camZ=3.3+3.4*eio(P(t,s03,E.cluster+1.5));camX=0.5*Math.sin(P(t,E.cluster,s04)*1.2);}
  if(t>=s04){camZ=4.2;camX=0.55;hor=lerp(1000,H*0.56,eo(P(t,s04,E.ad_shout)));F=1300;camH=lerp(2.0,1.6,eo(P(t,s04,E.ad_shout)));}
  return {camZ,camX,hor,F,camH};}
function proj(c,X,Z){const z=Z-c.camZ;if(z<0.8)return null;const s=c.F/z;return {s,x:W/2+(X-c.camX)*c.F/z,gy:c.hor+c.camH*s,z};}
function drawWorldA(t,c,o){const L=[];for(const q of WA){const pr=proj(c,q.X,q.Z);if(!pr)continue;if(pr.x<-pr.s||pr.x>W+pr.s)continue;L.push([q,pr]);}
  L.sort((a,b)=>b[1].z-a[1].z);
  for(const [q,pr] of L){const near=pr.z<4.5;const blur=near?Math.min(40,(1/pr.z-1/4.5)*140):Math.min(10,(1/4.5-1/pr.z)*45);
    let alpha=near?0.2:Math.max(0.12,0.7-pr.z*0.0065);alpha*=o.alphaFn?o.alphaFn(q):1;
    dots(pl,q,pr.x,pr.gy,pr.s,{density:3,r:Math.max(0.8,pr.s*0.005),col:o.col(q),alpha,blur,burst:o.burst?[o.burst[0],o.burst[1],o.burst[2]]:null,streak:o.streak?o.streak(q):0});}}

// ---------- WORLD B: oblique city of people (S05, S08 cover) — like SF3 v2
const WB=[];(function(){const r=rng(303);for(let i=0;i<5200;i++){let X=(r()*2-1)*60,Z=3+Math.pow(r(),1.25)*150;if(r()<.7){if(r()<.5)X=Math.round(X/6)*6+(r()-.5)*1.2;else Z=Math.round(Z/7)*7+(r()-.5)*1.4;}WB.push({X,Z,k:Math.floor(r()*6),v:r()});}})();
function drawWorldB(t,c,colFn,alphaMul=1){const L=[];for(const q of WB){const z=q.Z-c.camZ;if(z<1.2)continue;const s=c.F/z*.9,x=W/2+(q.X-c.camX)*c.F/z,gy=c.hor+c.camH*c.F/z;if(x<-60||x>W+60||gy>H+220||gy<c.hor-5)continue;L.push([q,z,s,x,gy]);}
  L.sort((a,b)=>b[1]-a[1]);
  for(const [q,z,s,x,gy] of L){const [col,yel]=colFn(q,z);const tl=yel?g:pl;const blur=z<6?Math.min(26,(6-z)*8):0;
    if(s>28)dots(tl,q,x,gy,s,{density:yel?6:3,r:Math.max(.9,s*.0058),col,alpha:(yel?.85:.25)*alphaMul,blur:blur*.6});
    else{tl.globalAlpha=(yel?Math.min(1,.5+s*.03):.25)*alphaMul;tl.fillStyle=col;const rr=Math.max(.7,s*.065);tl.fillRect(x-rr,gy-s*.7-rr,rr*2,rr*2);tl.globalAlpha=1;}}}

// ================= SCENES =================
const SIG0=[713,1250]; // SF1 signal point
function S01(t){const c=camA(t);bg([[W*.5,H*.6,900,C.p2,.55],[W*.78,H*.22,700,C.p1,.22],[W*.2,H*.95,600,C.p2,.4]],.35,t);beginLayers();
  const frozen=t>=E.freeze;const boom=P(t,E.impact,E.impact+1.25);const pre=t<E.impact;
  const shake=t>E.impact&&t<E.impact+.45?[(Math.sin(t*90)*9)*(1-P(t,E.impact,E.impact+.45)),(Math.cos(t*77)*7)*(1-P(t,E.impact,E.impact+.45))]:[0,0];
  const punch=1+0.04*(1-eo(P(t,E.impact,E.impact+.6)))*(t>E.impact?1:0);

function S06(t){bg([[W*.5,H*.55,900,C.p2,.45]],.28,t);beginLayers();
  drawWorldB(t,{camZ:0,camX:0,camH:7.5,hor:H*.3,F:1150},(q)=>[q.v<.96?C.y:C.lav,false],.18);composeParticles(.6);
  const op=eo(P(t,E.s06,E.s06+.6));const fadeRows=P(t,E.ramai_nampak-.3,E.ramai_nampak);

    const rq=rng(Math.floor(t*30)+7);const scr=(a,b,u)=>{if(u<=0)return a;if(u>=1)return b;const L=Math.round(lerp(a.length,b.length,u));const S='ABCDEFGHIJKLMNOPRSTUY#%';let s='';for(let i=0;i<L;i++)s+=(rq()<u?(b[i]||''):S[Math.floor(rq()*S.length)]);return s;};

function wordmark(x,y,size,a){ctx.save();ctx.globalAlpha=a;ctx.font=F_D(500,size);ctx.letterSpacing=`${-size*.02}px`;ctx.fillStyle=C.white;ctx.textAlign='left';const w1=ctx.measureText('LOKA').width;ctx.font=F_D(800,size);const w2=ctx.measureText('DIGITAL').width;const x0=x-(w1+w2)/2;
  ctx.font=F_D(500,size);ctx.fillText('LOKA',x0,y);ctx.font=F_D(800,size);ctx.fillText('DIGITAL',x0+w1,y);ctx.restore();return {x0,w:w1+w2};}

function overlay(t){let b=BEATS.find(x=>t>=x.t0&&t<x.t1)||BEATS[BEATS.length-1];

  if(t<E.s02)S01(t);else if(t<E.s03)S02(t);else if(t<E.s04)S03(t);else if(t<E.s05)S04(t);else if(t<E.s06)S05(t);else if(t<E.s07)S06(t);else if(t<E.s08)S07(t);else S08(t);
