<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:"JBM";src:url(fonts/jetbrains-mono-latin-400-normal.woff2) format("woff2");font-weight:400}
@font-face{font-family:"JBM";src:url(fonts/jetbrains-mono-latin-600-normal.woff2) format("woff2");font-weight:600}
html,body{margin:0;background:#05030A}
canvas{display:block}
</style></head>
<body><canvas id="c"></canvas>
<script>
// LOKADIGITAL EP02 — style frames (look development, stills only)
// Coordinates are authored in 1080x1920 space and rendered at 2x (2160x3840).
const W = 1080, H = 1920, S = 2;
const C = { ink:'#05030A', p1:'#602AC8', p2:'#301270', y:'#E8FF2B', lav:'#AB94FF', mist:'#D4CAF2', grey:'#7C7396', white:'#F4F1FF' };
const cv = document.getElementById('c'); cv.width = W*S; cv.height = H*S;
const ctx = cv.getContext('2d');

function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function layer(){ const c = document.createElement('canvas'); c.width = W*S; c.height = H*S; const x = c.getContext('2d'); x.setTransform(S,0,0,S,0,0); return [c,x]; }
function hexA(hex,a){ const n=parseInt(hex.slice(1),16); return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`; }
function mix(h1,h2,t){ const a=parseInt(h1.slice(1),16), b=parseInt(h2.slice(1),16); const r=(a>>16&255)*(1-t)+(b>>16&255)*t, g=(a>>8&255)*(1-t)+(b>>8&255)*t, bl=(a&255)*(1-t)+(b&255)*t; return '#'+[r,g,bl].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''); }

// ---------- human silhouette (head + shoulders bust), normalised: y from -0.75 (top) to 0.6 (bottom)
function inside(x,y){
  const hx=x/0.165, hy=(y+0.55)/0.195; if (hx*hx+hy*hy<=1) return true;          // head
  if (y>-0.38 && y<-0.26 && Math.abs(x)<0.075) return true;                        // neck
  if (y>=-0.3 && y<=0.6){                                                          // shoulders + torso
    let hw;
    if (y < -0.05){ const t=(y+0.3)/0.25; hw = 0.08 + 0.38*Math.sqrt(Math.max(0,1-(1-t)*(1-t))); }
    else hw = 0.46 - 0.07*((y+0.05)/0.65);
    return Math.abs(x) <= hw;
  }
  return false;
}
// precompute a library of sample points per silhouette (edge-weighted)
function samplePerson(r, n){
  const pts=[]; let guard=0;
  while (pts.length<n && guard++<n*60){
    const x=(r()*2-1)*0.52, y=-0.76+r()*1.36;
    if (!inside(x,y)) continue;
    const e=0.03; const edge = !inside(x+e,y)||!inside(x-e,y)||!inside(x,y+e)||!inside(x,y-e);
    const fadeBottom = y>0.25 ? (0.6-y)/0.35 : 1;               // bust dissolves at the bottom
    if (r() > (edge ? 1 : 0.32)*fadeBottom) continue;
    pts.push([x,y,edge]);
  }
  return pts;
}

// soft dot (bokeh) or sharp glowing point
function dot(x2,x,y,r,col,a,blur){
  if (blur>1.2){
    const R=r+blur*0.6; const k=a*Math.min(1,Math.pow((r+1)/R,0.8)*1.6); const g=x2.createRadialGradient(x,y,0,x,y,R);
    g.addColorStop(0,hexA(col,k*0.55)); g.addColorStop(0.8,hexA(col,k*0.4)); g.addColorStop(1,hexA(col,0));
    x2.fillStyle=g; x2.beginPath(); x2.arc(x,y,R,0,7); x2.fill();
  } else {
    x2.fillStyle=hexA(col,a); x2.beginPath(); x2.arc(x,y,Math.max(0.55,r),0,7); x2.fill();
  }
}
function drawPerson(x2, cx, gy, s, opt){
  const pts = opt.pts; const bf = opt.blur>1.2 ? 1/(1+opt.blur/5) : 1; const n = Math.min(pts.length, Math.max(4, Math.round(opt.density*s*bf*Math.min(1,Math.pow(s/160,0.9)))));
  const step = pts.length/n; const rot = opt.rot||0, cr=Math.cos(rot), sr=Math.sin(rot);
  for (let i=0;i<n;i++){
    const p = pts[Math.floor(i*step)]; let px=p[0], py=p[1]-0.6;
    const qx = px*cr - py*sr, qy = px*sr + py*cr;
    let X = cx + qx*s, Y = gy + qy*s;
    let a = opt.alpha*(p[2]?1:0.55)/(1+(opt.blur||0)/9);
    if (opt.scatter){ const k=opt.scatter(p,i); X+=k[0]; Y+=k[1]; a*=k[2]; }
    const col = opt.colFn ? opt.colFn(p,i) : opt.col;
    dot(x2, X, Y, opt.r, col, a, opt.blur);
    if (opt.streak){ const [dx,dy]=opt.streak; x2.strokeStyle=hexA(col,a*0.35); x2.lineWidth=opt.r*0.9; x2.beginPath(); x2.moveTo(X,Y); x2.lineTo(X-dx,Y-dy); x2.stroke(); }
  }
}

// ---------- atmosphere
function atmosphere(x2, cfg){
  x2.fillStyle=C.ink; x2.fillRect(0,0,W,H);
  for (const L of cfg.lights){ const g=x2.createRadialGradient(L[0],L[1],0,L[0],L[1],L[2]); g.addColorStop(0,hexA(L[3],L[4])); g.addColorStop(1,hexA(L[3],0)); x2.fillStyle=g; x2.fillRect(0,0,W,H); }
  // volumetric fog: fbm value noise at low res, stretched
  const fw=108, fh=192, fc=document.createElement('canvas'); fc.width=fw; fc.height=fh; const f=fc.getContext('2d'); const id=f.createImageData(fw,fh);
  const r=rng(cfg.seed||7); const grid=[]; for(let i=0;i<40*40;i++) grid.push(r());
  const vn=(x,y)=>{ const xi=Math.floor(x), yi=Math.floor(y), xf=x-xi, yf=y-yi; const g=(a,b)=>grid[((a%40+40)%40)+((b%40+40)%40)*40]; const sm=t=>t*t*(3-2*t);
    const a=g(xi,yi), b=g(xi+1,yi), c=g(xi,yi+1), d=g(xi+1,yi+1); return a+(b-a)*sm(xf)+(c-a)*sm(yf)+(a-b-c+d)*sm(xf)*sm(yf); };
  for (let y=0;y<fh;y++) for (let x=0;x<fw;x++){ let v=0,amp=0.55,fr=0.035; for(let o=0;o<4;o++){ v+=amp*vn(x*fr,y*fr); amp*=0.5; fr*=2; }
    const k=(y*fw+x)*4; const t=Math.max(0,v-0.42)*1.5; id.data[k]=96*t; id.data[k+1]=42*t; id.data[k+2]=200*t; id.data[k+3]=255; }
  f.putImageData(id,0,0);
  x2.save(); x2.globalCompositeOperation='screen'; x2.globalAlpha=cfg.fog; x2.filter='blur(18px)'; x2.drawImage(fc,0,0,W,H); x2.restore();
}
function finish(x2, seed){
  // vignette
  const g=x2.createRadialGradient(W/2,H*0.52,H*0.25,W/2,H*0.52,H*0.78); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.78)');
  x2.fillStyle=g; x2.fillRect(0,0,W,H);
  // film grain (rendered at full output resolution)
  const gc=document.createElement('canvas'); gc.width=W*S; gc.height=H*S; const gx=gc.getContext('2d'); const id=gx.createImageData(W*S,H*S); const r=rng(seed);
  for (let i=0;i<id.data.length;i+=4){ const v=128+(r()+r()+r()-1.5)*90; id.data[i]=id.data[i+1]=id.data[i+2]=v; id.data[i+3]=255; }
  gx.putImageData(id,0,0);
  x2.save(); x2.setTransform(1,0,0,1,0,0); x2.globalCompositeOperation='overlay'; x2.globalAlpha=0.13; x2.drawImage(gc,0,0); x2.restore();
}
function bloom(x2, src, a1, a2){
  x2.save(); x2.setTransform(1,0,0,1,0,0); x2.globalCompositeOperation='lighter';
  x2.globalAlpha=a1; x2.filter=`blur(${60*S}px)`; x2.drawImage(src,0,0);
  x2.globalAlpha=a2; x2.filter=`blur(${14*S}px)`; x2.drawImage(src,0,0);
  x2.globalAlpha=1; x2.filter='none'; x2.drawImage(src,0,0); x2.restore();
}

// ---------- Signal Line: smooth path with layered glow + white-hot core + anamorphic flare at the head
function catmull(pts, seg){ const out=[]; for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  for(let t=0;t<seg;t++){ const u=t/seg,u2=u*u,u3=u2*u; out.push([0.5*((2*p1[0])+(-p0[0]+p2[0])*u+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*u2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*u3),
    0.5*((2*p1[1])+(-p0[1]+p2[1])*u+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*u2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*u3)]); } } out.push(pts[pts.length-1]); return out; }
function signalLine(x2, pts, o={}){
  const P=catmull(pts,24), n=P.length, w=o.w||3.2;
  for (let i=1;i<n;i++){            // taper: thin tail -> full at head
    const t=i/n, k=o.taper===false?1:Math.min(1,0.15+t*1.4);
    x2.strokeStyle=hexA(C.y,(o.alpha||1)*Math.min(1,0.25+t)); x2.lineWidth=w*k*1.9; x2.lineCap='round';
    x2.beginPath(); x2.moveTo(P[i-1][0],P[i-1][1]); x2.lineTo(P[i][0],P[i][1]); x2.stroke();
  }
  x2.strokeStyle=hexA('#FFFFF0',0.9*(o.alpha||1)); x2.lineWidth=w*0.55; x2.beginPath(); P.forEach((p,i)=>i?x2.lineTo(p[0],p[1]):x2.moveTo(p[0],p[1])); x2.stroke();
  if (o.head!==false) flare(x2, P[n-1][0], P[n-1][1], o.flare||1);
  if (o.sparks){ const r=rng(o.sparks); for (let i=0;i<90;i++){ const p=P[Math.floor(Math.pow(r(),0.6)*(n-1))]; dot(x2,p[0]+(r()-0.5)*22,p[1]+(r()-0.5)*22,0.6+r()*1.2,C.y,0.35+r()*0.5,0); } }
  return P;
}
function flare(x2,x,y,k){
  let g=x2.createRadialGradient(x,y,0,x,y,26*k); g.addColorStop(0,'rgba(255,255,245,1)'); g.addColorStop(0.25,hexA(C.y,0.9)); g.addColorStop(1,hexA(C.y,0));
  x2.fillStyle=g; x2.beginPath(); x2.arc(x,y,26*k,0,7); x2.fill();
  x2.save(); x2.translate(x,y); x2.scale(1,0.018); g=x2.createRadialGradient(0,0,0,0,0,420*k); g.addColorStop(0,hexA('#FFFFF0',0.95)); g.addColorStop(0.15,hexA(C.y,0.5)); g.addColorStop(1,hexA(C.y,0));
  x2.fillStyle=g; x2.beginPath(); x2.arc(0,0,420*k,0,7); x2.fill(); x2.restore();
}

// ---------- typography
function txt(x2, s, x, y, o){
  x2.save(); x2.font=o.font; x2.letterSpacing=o.ls||'0px'; x2.textBaseline='alphabetic'; x2.textAlign=o.align||'left';
  if (o.blur) x2.filter=`blur(${o.blur}px)`; x2.globalAlpha=o.alpha==null?1:o.alpha;
  if (o.glow){ x2.shadowColor=o.glow; x2.shadowBlur=o.glowR||24; }
  x2.fillStyle=o.col; x2.fillText(s,x,y); const m=x2.measureText(s).width; x2.restore(); return m;
}
function underline(x2, x, y, w, prog, glowL){   // drawn L->R, glowing head = motion cue
  const e=x+w*prog; x2.strokeStyle=C.y; x2.lineWidth=7; x2.lineCap='butt'; x2.beginPath(); x2.moveTo(x,y); x2.lineTo(e,y); x2.stroke();
  if (glowL){ glowL.strokeStyle=C.y; glowL.lineWidth=7; glowL.beginPath(); glowL.moveTo(x,y); glowL.lineTo(e,y); glowL.stroke(); if(prog<1) flare(glowL,e,y,0.55); }
}
function rail(x2, glowL, active){   // Signal Rail HUD at y220-290
  const y=255, x0=96, x1=W-176, labs=['CARI','CAKAP','SAMBUNG'];
  x2.strokeStyle=hexA(C.lav,0.35); x2.lineWidth=1.5; x2.beginPath(); x2.moveTo(x0,y); x2.lineTo(x1,y); x2.stroke();
  const xs=labs.map((_,i)=>x0+(x1-x0)*(i/(labs.length-1)));
  const doneTo = xs[Math.max(0,active)];
  glowL.strokeStyle=C.y; glowL.lineWidth=2.5; glowL.beginPath(); glowL.moveTo(x0,y); glowL.lineTo(doneTo,y); glowL.stroke();
  labs.forEach((l,i)=>{ const x=xs[i];
    if (i<active){ glowL.fillStyle=C.y; glowL.beginPath(); glowL.arc(x,y,8,0,7); glowL.fill(); }
    else if (i===active){ glowL.strokeStyle=C.y; glowL.lineWidth=2.5; glowL.beginPath(); glowL.arc(x,y,13,0,7); glowL.stroke(); glowL.fillStyle=C.y; glowL.beginPath(); glowL.arc(x,y,5,0,7); glowL.fill(); }
    else { x2.strokeStyle=hexA(C.lav,0.55); x2.lineWidth=1.5; x2.beginPath(); x2.arc(x,y,7,0,7); x2.stroke(); }
    txt(x2, `0${i+1} ${l}`, x, y+46, {font:'600 21px JBM', ls:'5px', col: i<=active?C.mist:hexA(C.lav,0.6), align: i===0?'left':(i===2?'right':'center')});
  });
}
// annotation helpers (review overlay only)
function note(x2, x, y, lines, ax, ay){
  x2.save(); x2.font='400 19px JBM'; x2.letterSpacing='1px';
  const w=Math.max(...lines.map(l=>x2.measureText(l).width))+28, h=lines.length*28+18;
  x2.fillStyle='rgba(5,3,10,0.82)'; x2.fillRect(x,y,w,h); x2.strokeStyle='rgba(244,241,255,0.55)'; x2.lineWidth=1; x2.strokeRect(x+0.5,y+0.5,w,h);
  lines.forEach((l,i)=>{ x2.fillStyle= i===0? C.y : 'rgba(244,241,255,0.92)'; x2.fillText(l,x+14,y+32+i*28); });
  if (ax!=null){ x2.strokeStyle='rgba(244,241,255,0.7)'; x2.setLineDash([5,5]); x2.beginPath(); const sx = ax < x ? x : (ax > x+w ? x+w : x+w/2); const sy = ay < y ? y : y+h; x2.moveTo(sx,sy); x2.lineTo(ax,ay); x2.stroke(); x2.setLineDash([]); x2.fillStyle='rgba(244,241,255,0.9)'; x2.beginPath(); x2.arc(ax,ay,4,0,7); x2.fill(); }
  x2.restore();
}
function arrow(x2, x1,y1,x2_,y2, label){
  x2.save(); x2.strokeStyle='rgba(244,241,255,0.75)'; x2.lineWidth=2; x2.beginPath(); x2.moveTo(x1,y1); x2.lineTo(x2_,y2); x2.stroke();
  const a=Math.atan2(y2-y1,x2_-x1); x2.beginPath(); x2.moveTo(x2_,y2); x2.lineTo(x2_-16*Math.cos(a-0.4),y2-16*Math.sin(a-0.4)); x2.moveTo(x2_,y2); x2.lineTo(x2_-16*Math.cos(a+0.4),y2-16*Math.sin(a+0.4)); x2.stroke(); x2.restore();
}

// ======================================================================
// SF1 — HOOK "SIAPA." (Scene 01 · ~6.2 s): frozen crowd, one person resolved, Signal point starts to stretch
function SF1(annot){
  ctx.setTransform(S,0,0,S,0,0);
  atmosphere(ctx,{seed:11, fog:0.35, lights:[[W*0.5,H*0.6,900,C.p2,0.55],[W*0.78,H*0.22,700,C.p1,0.22],[W*0.2,H*0.95,600,C.p2,0.4]]});
  const [gl,g] = layer(); const [pl,p] = layer();
  const r=rng(101); const lib=[0,1,2,3,4,5].map(i=>samplePerson(rng(500+i), 900));
  // v2: discrete depth layers, sparse jittered spacing -> individuals stay readable (no fog band)
  const hor=1000, F=1500, camH=2.0, zf=4.5, people=[];
  const LAYERS=[[6,9,9],[10,16,18],[18,30,30],[34,55,44],[60,95,60]];
  for (const [z0,z1,n] of LAYERS) for (let i=0;i<n;i++){ const z=z0+r()*(z1-z0); const u=(i+0.5+(r()-0.5)*0.8)/n; people.push({z,X:(-0.44+0.88*u)*z,k:Math.floor(r()*6)}); }
  people.push({z:2.3,X:-0.62,k:1},{z:2.6,X:0.66,k:4});            // two out-of-focus foreground figures at the edges
  people.sort((a,b)=>b.z-a.z);
  for (const q of people){
    const s=F/q.z, cx=W/2+q.X*F/q.z, gy=hor+camH*s;
    if (cx<-s||cx>W+s) continue;
    const near=q.z<zf, blur=near?Math.min(40,(1/q.z-1/zf)*140):Math.min(10,(1/zf-1/q.z)*45);
    drawPerson(p,cx,gy,s,{pts:lib[q.k],density:3,r:Math.max(0.8,s*0.005),col:mix(C.grey,C.lav,0.4),alpha:near?0.2:Math.max(0.12,0.7-q.z*0.0065),blur});
  }
  // the resolved person: dots converging into a crisp silhouette (motion cue: inward streaks)
  const hero=samplePerson(rng(77),1600), hx=W*0.32, hgy=hor+camH*(F/zf), hs=F/zf;
  drawPerson(p,hx,hgy,hs,{pts:hero,density:8,r:1.6,col:'#EEE9FF',alpha:1,blur:0,
    scatter:(pt,i)=>{ const rr=rng(i*7+3)(); if (rr<0.82) return [0,0,1]; const d=(rr-0.82)*900; const a=Math.atan2(pt[1]+0.1,pt[0]); return [Math.cos(a)*d*0.6,Math.sin(a)*d*0.6,0.6]; }});
  p.save(); p.globalCompositeOperation='lighter'; const hg=p.createRadialGradient(hx,hgy-hs*0.75,0,hx,hgy-hs*0.75,hs*0.9); hg.addColorStop(0,hexA(C.lav,0.3)); hg.addColorStop(1,hexA(C.lav,0)); p.fillStyle=hg; p.fillRect(0,0,W,H); p.restore();
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='lighter'; ctx.drawImage(pl,0,0); ctx.restore();
  // Signal: yellow point beginning to stretch into a line (anamorphic)
  const sy=1250, sx=W*0.66;
  signalLine(g,[[sx-110,sy+1],[sx-40,sy],[sx,sy]],{w:2.2,flare:0.5,taper:true});
  g.fillStyle=hexA(C.y,0.9); g.beginPath(); g.arc(sx,sy,4,0,7); g.fill();
  // typography: previous line exiting (masked-rise out), main word in
  txt(ctx,'Masalahnya bukan berapa ramai.',96,470,{font:'700 54px "Inter Display"',ls:'-1.5px',col:C.white,alpha:0.18,blur:5});
  const w=txt(ctx,'SIAPA.',90,760,{font:'800 250px "Inter Display"',ls:'-10px',col:C.y});
  txt(g,'SIAPA.',90,760,{font:'800 250px "Inter Display"',ls:'-10px',col:C.y});
  underline(ctx,98,808,w-60,0.72,g);
  bloom(ctx,gl,0.55,0.7);
  finish(ctx,9001);
  if (annot){
    note(ctx,560,330,['TYPOGRAPHY · SUARA SIGNAL','"SIAPA." naik dari garis dasar','(masked rise 6 frame, expo-out).','Ayat sebelum keluar ke atas + kabur'],420,640);
    note(ctx,560,860,['UNDERLINE','dilukis kiri → kanan 0.30 s,','hujung bercahaya = signal ping'],760,808);
    note(ctx,40,960,['ZARAH MANUSIA · K1','titik berkumpul jadi satu siluet','(2.7–3.4 s), kemudian lebur','semula jadi satu titik'],hx,hgy-hs*0.7);
    note(ctx,600,1330,['SIGNAL LINE','titik kuning memanjang jadi garis;','kamera berpusing 90° mengikutnya','(transition ke Scene 02)'],sx,sy);
    note(ctx,560,1700,['KAMERA','dolly-in perlahan menembus orang','ramai yang beku (expo-in), rack','focus pada siluet. Orang ramai kelabu'],null,null);
  }
}

// ======================================================================
// SF2 — BAB 02 "CAKAP" (Scene 04 · ~34.5 s): F&B line typed, narrow yellow beam, yellow cluster turns to the message
function SF2(annot){
  ctx.setTransform(S,0,0,S,0,0);
  atmosphere(ctx,{seed:23, fog:0.32, lights:[[W*0.35,H*0.5,800,C.p1,0.28],[W*0.75,H*0.8,700,C.p2,0.6],[W*0.1,H*0.2,600,C.p2,0.45]]});
  const [gl,g] = layer(); const [pl,p] = layer();
  const r=rng(202); const lib=[0,1,2,3,4,5].map(i=>samplePerson(rng(600+i),900));
  // background crowd: grey, drifting away (streaks pointing outwards = motion cue: they turn away from noise)
  const hor=H*0.56, F=1300;
  for (let i=0;i<1200;i++){ const z=7+Math.pow(r(),0.85)*50, X=(r()*2-1)*0.5*z, s=F/z, cx=W/2+X*F/z, gy=hor+1.1*s;
    if (cx<-s||cx>W+s) continue; const blur=Math.min(30,Math.abs(1/z-1/7)*50);
    const dir = cx<W*0.5 ? -1 : 1;
    drawPerson(p,cx,gy,s,{pts:lib[i%6],density:2.4,r:Math.max(0.7,s*0.005),col:mix(C.grey,C.lav,0.25),alpha:z<7?0.1:Math.max(0.06,0.34-z*0.0055),blur,streak: z<14?[ -dir*s*0.05, 0]:null});
  }
  ctx.save(); ctx.setTransform(1,0,0,1,0,0); ctx.globalCompositeOperation='lighter'; ctx.drawImage(pl,0,0); ctx.restore();
  // the ad card (glass, slight perspective)
  ctx.save(); ctx.translate(96,820); ctx.transform(1,-0.045,0,1,0,0);

// v2 DIRECTION — PROTAGONIST ("pemilik F&B", CONTOH): recognisable silhouette
// bun hair + apron bib & straps + phone held at chest (lavender screen glow). Pose: 'down' (scrolling) or 'up' (looking up)
function insidePersona(x,y,pose){
  const up=pose==='up'; const hx=up?0:0.04, hy=up?-0.55:-0.47;
  const ex=(x-hx)/0.16, ey=(y-hy)/0.19; if(ex*ex+ey*ey<=1) return true;                       // head
  const bx=(x-(up?-0.025:-0.015))/0.105, by=(y-(up?-0.725:-0.655))/0.095; if(bx*bx+by*by<=1) return true;  // bun: one smooth top knot
  if(y>-0.38&&y<-0.26&&Math.abs(x)<0.075) return true;                                      // neck
  if(y>=-0.3&&y<=0.6){let hw; if(y<-0.05){const t=(y+0.3)/0.25;hw=0.08+0.38*Math.sqrt(Math.max(0,1-(1-t)*(1-t)));} else hw=0.46-0.07*((y+0.05)/0.65); return Math.abs(x)<=hw;}
  return false;
}
function personaFeatures(pose){        // explicit contour lines -> brighter "feature" dots (apron, straps, arm, phone)
  const up=pose==='up'; const L=[];
  L.push([[-0.07,-0.27],[-0.2,-0.02]],[[0.07,-0.27],[0.2,-0.02]]);                    // apron straps (neck -> bib corners)
  L.push([[-0.2,-0.02],[-0.22,0.6]],[[0.2,-0.02],[0.22,0.6]],[[-0.2,-0.02],[0.2,-0.02]]); // bib outline
  L.push([[-0.22,0.2],[-0.42,0.22]],[[0.22,0.2],[0.42,0.22]]);                          // apron tie
  if(!up){ L.push([[0.38,0.1],[0.13,0.0]],[[-0.36,0.12],[-0.05,0.04]]); }           // forearms reaching the phone
  return L;
}
function samplePersona(r,n,pose){
  const pts=[]; let g=0;
  while(pts.length<n*0.72&&g++<n*80){const x=(r()*2-1)*0.52,y=-0.8+r()*1.4; if(!insidePersona(x,y,pose))continue;
    const e=0.028; const edge=!insidePersona(x+e,y,pose)||!insidePersona(x-e,y,pose)||!insidePersona(x,y+e,pose)||!insidePersona(x,y-e,pose);
    const fb=y>0.3?(0.6-y)/0.3:1; if(r()>(edge?1:0.3)*fb)continue; pts.push([x,y,edge?1:0]);}
  for(const [a,b] of personaFeatures(pose)){const len=Math.hypot(b[0]-a[0],b[1]-a[1]); const k=Math.round(len*n*0.05);
    for(let i=0;i<k;i++){const u=r(); if(a[1]+(b[1]-a[1])*u>0.55) continue; pts.push([a[0]+(b[0]-a[0])*u+(r()-0.5)*0.018,a[1]+(b[1]-a[1])*u+(r()-0.5)*0.018,2]);}}
  return pts;
}
function drawPersona(x2,cx,gy,s,pose,o){
  const pts=o.pts; const lit=o.col||C.mist;
  drawPerson(x2,cx,gy,s,{pts,density:o.density||9,r:o.r||1.5,alpha:o.alpha||1,blur:o.blur||0,
    colFn:p=>p[2]===2?(o.feat||C.white):lit, scatter:(p,i)=>[0,0,p[2]===2?0.9:1]});
  if(pose!=='up'){ // the phone: a small glowing screen held at the chest + its light on the face
    const sx=cx+0.0*s, sy=gy+(-0.1-0.6)*s, sw=0.1*s, sh=0.16*s;
    x2.save(); x2.globalCompositeOperation='lighter'; x2.translate(sx+sw/2,sy+sh/2); x2.rotate(-0.25); x2.scale(1,0.55);
    const sg=x2.createLinearGradient(0,-sh/2,0,sh/2); sg.addColorStop(0,hexA('#F2EEFF',0.55)); sg.addColorStop(1,hexA('#B9A8FF',0.25)); x2.fillStyle=sg; x2.fillRect(-sw/2,-sh/2,sw,sh); x2.restore();
    const px=cx+0.03*s, py=gy+(-0.25-0.6)*s; const gr=x2.createRadialGradient(px,py,0,px,py,s*0.42); gr.addColorStop(0,hexA(o.glow||C.lav,0.34)); gr.addColorStop(1,hexA(o.glow||C.lav,0));
    x2.save(); x2.globalCompositeOperation='lighter'; x2.fillStyle=gr; x2.beginPath(); x2.arc(px,py,s*0.42,0,7); x2.fill(); x2.restore(); }
}

// SF5 — S05 "BESARKAN DENGAN ADS" (≈ 42 s): 3 variants tested, winner fed into the amplifier, beam reaches people like her
function miniCard(x2,cx,cy,w,h,o){x2.save();x2.translate(cx,cy);x2.transform(1,o.skew||0,0,1,0,0);x2.globalAlpha=o.alpha;
  x2.fillStyle='rgba(22,12,46,0.78)';x2.fillRect(-w/2,-h/2,w,h);x2.strokeStyle=o.win?hexA(C.y,0.9):hexA(C.lav,0.45);x2.lineWidth=o.win?2:1.5;x2.strokeRect(-w/2,-h/2,w,h);
  txt(x2,o.tag,-w/2+16,-h/2+28,{font:'600 14px JBM',ls:'3px',col:o.win?C.y:C.grey});
  ico(x2,hexA(C.lav,0.7),1.5);x2.beginPath();x2.moveTo(w/2-40,-h/2+14);x2.lineTo(w/2-36,-h/2+36);x2.lineTo(w/2-18,-h/2+36);x2.lineTo(w/2-14,-h/2+14);x2.closePath();x2.stroke();
  if(o.win){txt(x2,'Post content setiap hari,',-w/2+16,-h/2+68,{font:'600 19px "Inter Display"',col:C.white});txt(x2,'tapi pelanggan tetap',-w/2+16,-h/2+94,{font:'600 19px "Inter Display"',col:C.white});}
  else{x2.fillStyle=hexA(C.mist,0.35);x2.fillRect(-w/2+16,-h/2+54,w*0.7,10);x2.fillRect(-w/2+16,-h/2+76,w*0.52,10);}
  x2.restore();}

  const [gl,g]=layer(); const [pl,p]=layer();
  const r=rng(505); const lib=[0,1,2,3,4,5].map(i=>samplePerson(rng(700+i),900));
  // city of people below; only those inside the beam AND matching the profile light up
  const hor=1330, F=900, camH=6.5, ppl=[];
  for(let i=0;i<4200;i++){let X=(r()*2-1)*50,Z=3+Math.pow(r(),1.3)*110; if(r()<0.7){if(r()<0.5)X=Math.round(X/5)*5+(r()-0.5);else Z=Math.round(Z/6)*6+(r()-0.5);} ppl.push([X,Z,Math.floor(r()*6),r()]);}
  ppl.sort((a,b)=>b[1]-a[1]);
  const ax=W/2, ay=1150;
  for(const q of ppl){const z=q[1], s=F/z*0.9, cx=W/2+q[0]*F/z, gy=hor+camH*F/z; if(cx<-60||cx>W+60||gy>H+200)continue;
    const spread=(gy-ay)*0.62+30; const inBeam=Math.abs(cx-ax)<spread; const match=q[3]<0.78; const lit=inBeam&&match;
    const col=lit?C.y:C.lav; const tl=lit?g:p; const blur=z<6?Math.min(20,(6-z)*7):0;
    if(s>26) drawPerson(tl,cx,gy,s,{pts:lib[q[2]],density:lit?5:2.6,r:Math.max(0.9,s*0.0058),col,alpha:lit?0.8:0.22,blur:blur*0.6});
    else {tl.globalAlpha=lit?Math.min(1,0.45+s*0.03):0.22;tl.fillStyle=col;const rr=Math.max(0.7,s*0.065);tl.fillRect(cx-rr,gy-s*0.7-rr,rr*2,rr*2);tl.globalAlpha=1;}
  }
  ctx.save();ctx.setTransform(1,0,0,1,0,0);ctx.globalCompositeOperation='lighter';ctx.drawImage(pl,0,0);ctx.restore();
  // beam cone from the amplifier down into the city
  g.save();g.filter='blur(26px)';const bg_=g.createLinearGradient(0,ay,0,H);bg_.addColorStop(0,hexA(C.y,0.30));bg_.addColorStop(0.5,hexA(C.y,0.08));bg_.addColorStop(1,hexA(C.y,0));
  g.fillStyle=bg_;g.beginPath();g.moveTo(ax-70,ay);g.lineTo(ax+70,ay);g.lineTo(ax+(H-ay)*0.62+60,H);g.lineTo(ax-(H-ay)*0.62-60,H);g.closePath();g.fill();g.restore();
  // the protagonist, recognisable (bun + apron), now head UP and lit: she is among the people the ads reach

  drawPersona(g,250,H+150,430,'up',{pts:PRu,density:8,r:1.5,col:C.y,feat:'#F4FF9A',alpha:0.85});
  // amplifier: stacked rings in perspective (the S02 "SAMBUNG" icon, now a 3D object)
  for(let k=0;k<6;k++){const ry=ay-k*16, rx=150-k*16; ctx.strokeStyle=hexA(C.lav,0.35+k*0.06);ctx.lineWidth=1.6;ctx.beginPath();ctx.ellipse(ax,ry,rx,rx*0.22,0,0,7);ctx.stroke();}
  g.strokeStyle=C.y;g.lineWidth=3;g.beginPath();g.ellipse(ax,ay,150,33,0,0,7);g.stroke();
  for(let k=1;k<=4;k++){g.globalAlpha=0.5/k;g.lineWidth=2;g.beginPath();g.ellipse(ax,ay+18*k,150+k*60,33+k*14,0,0.15*Math.PI,0.85*Math.PI);g.stroke();} g.globalAlpha=1;   // pulses travelling down
  txt(ctx,'ADS',ax,ay-120,{font:'600 18px JBM',ls:'6px',col:hexA(C.mist,0.8),align:'center'});
  // three tested variants (descendants of the file -> ad card)
  const cy=820, xs=[205,540,875];

    const my=cy+(win?84:98), mw=win?260:210; txt(ctx,'BERHENTI SCROLL',x-mw/2,my-8,{font:'400 12px JBM',ls:'2px',col:hexA(C.lav,win?0.8:0.45)});
    ctx.strokeStyle=hexA(C.lav,win?0.7:0.35);ctx.lineWidth=1.2;ctx.strokeRect(x-mw/2,my,mw,10);
    if(win){g.fillStyle=C.y;g.fillRect(x-mw/2+2,my+2,(mw-4)*meters[i],6);flare(g,x-mw/2+2+(mw-4)*meters[i],my+5,0.4);}
    else{ctx.fillStyle=hexA(C.lav,0.4);ctx.fillRect(x-mw/2+2,my+2,(mw-4)*meters[i],6);
      ctx.strokeStyle=hexA(C.lav,0.6);ctx.lineWidth=2;const ex=x+mw/2-12,ey=cy-60;ctx.beginPath();ctx.moveTo(ex-9,ey-9);ctx.lineTo(ex+9,ey+9);ctx.moveTo(ex+9,ey-9);ctx.lineTo(ex-9,ey+9);ctx.stroke();}
  });
  txt(g,'YANG MENJADI',540,cy-140,{font:'600 18px JBM',ls:'5px',col:C.y,align:'center'}); txt(ctx,'YANG MENJADI',540,cy-140,{font:'600 18px JBM',ls:'5px',col:C.y,align:'center'});
  // winning card -> amplifier (Signal Line), with an energy pulse
  signalLine(g,[[540,cy+100],[548,cy+180],[536,ay-110],[540,ay-30]],{w:2.6,flare:0.7,sparks:7});

  txt(ctx,'BESARKAN',96,440,{font:'800 104px "Inter Display"',ls:'-3.5px',col:C.y}); txt(g,'BESARKAN',96,440,{font:'800 104px "Inter Display"',ls:'-3.5px',col:C.y});
  txt(ctx,'DENGAN ADS.',96,554,{font:'800 104px "Inter Display"',ls:'-3.5px',col:C.white});

    note(ctx,40,1000,['AMPLIFIER = ADS','ikon SAMBUNG dari S02 kini objek 3D;','gelang berdenyut ikut beat'],ax-150,ay);
    note(ctx,600,1060,['PANCARAN','hanya orang dalam pancaran YANG','sepadan profil menyala (bukan semua)'],ax+180,ay+260);
    note(ctx,560,1560,['WATAK UTAMA (continuity)','sanggul + apron, kini mendongak','dan kuning: dia antara yang dicapai'],250,H-160);
    note(ctx,40,1740,['KAMERA','ikut pemenang ke amplifier → tracking','laju sepanjang pancaran → crane-out'],null,null);
  }
}
