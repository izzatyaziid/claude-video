const W = 1080, H = 1920, INK = '#05030A', P1 = '#602AC8', P2 = '#301270', Y = '#E8FF2B', LAV = '#AB94FF', WH = '#F4F1FF';
const cl = v => Math.max(0, Math.min(1, v)), P = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;

// ---- layout
const SX = 36, SY = 36, SW = 1008, SH = 1030;            // phone screen viewport
const POST_H = 1130, HEAD = 96, MED = 900;                // one feed post block
const CAM_Y = 1100;                                       // face-cam region top
// ---- timeline
const T = { swipe1: 2.55, swipe2: 4.85, flick: 6.55, hook: 8.35, line2: 9.6, smirk: 10.4, freeze: 11.9, big: 12.2, anat: 14.6, rule: 18.3, cta: 20.3, end: 24 };
// feed order (index → content). 0 salam, 1 promo, 2 text wall, 3..6 blur filler, 7 HOOK, 8 LOKADIGITAL
const HOOK = 7, LDI = 8;
// scroll position in post units
function scroll(t) {
  let s = 0;
  s += eio(P(t, T.swipe1, T.swipe1 + .42));
  s += eio(P(t, T.swipe2, T.swipe2 + .38));
  const fu = P(t, T.flick, T.hook + .25); s += 5 * (1 - Math.pow(1 - fu, 2.6)) + (fu > 0 ? Math.sin(fu * Math.PI) * 0 : 0);

}
// screen-light colour per post (lights the face)
const LIGHT = ['#2F8C7E', '#D8322E', '#E9E6EE', '#5A6CC8', '#E09A3A', '#7A4BD0', '#3BA36A', '#15101C', '#602AC8'];

// ---------- post artwork (media 1008 x 900)
function media(i) {

    g.textAlign = 'center'; g.fillStyle = '#C8231F'; g.font = '190px Anton'; g.fillText('PROMO', 504, 440); g.font = '120px Anton'; g.fillText('SEMUA ITEM!', 504, 570);

const HANDLES = [['kedai.abc.official', '#1F6F66', ''], ['mega.store.my', '#C8231F', 'Ditaja'], ['syarikat_xyz', '#9C9AA6', ''], ['offer.hari.ini', '#5A6CC8', ''], ['pagi.ceria', '#E09A3A', ''], ['newarrival.my', '#7A4BD0', ''], ['jomorder.co', '#3BA36A', ''], ['sambal.kakros', '#C8231F', ''], ['lokadigital', P1, '']];

  g.beginPath(); g.moveTo(200, ay - 24); g.lineTo(246, ay - 24); g.lineTo(222, ay + 20); g.lineTo(218, ay - 4); g.closePath(); g.stroke();
  g.beginPath(); g.moveTo(944, ay - 26); g.lineTo(974, ay - 26); g.lineTo(974, ay + 24); g.lineTo(959, ay + 10); g.lineTo(944, ay + 24); g.closePath(); g.stroke();

}

  const r = rng(8); for (let k = 0; k < 7; k++) { const bx = 700 + r() * 360, by = 60 + r() * 260, br = 20 + r() * 40; const b = g.createRadialGradient(bx, by, 0, bx, by, br); b.addColorStop(0, `rgba(255,200,140,${.10 + r() * .1})`); b.addColorStop(1, 'rgba(255,200,140,0)'); g.fillStyle = b; g.fillRect(bx - br, by - br, br * 2, br * 2); }
  for (let k = 0; k < 4; k++) { const [c, q] = mk(540, 960); const d = q.createImageData(540, 960); const rr_ = rng(70 + k); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (rr_() + rr_() - 1) * 80; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } q.putImageData(d, 0, 0); grain.push(c); }

// ---------- hook post typography (drawn live so it can be annotated / revealed)
function hookType(g, ox, oy, t) {
  const a = P(t, T.hook - .05, T.hook + .1);
  g.save(); g.translate(ox, oy + HEAD); g.textAlign = 'left';
  g.fillStyle = Y; g.font = '182px Anton';
  const k1 = spring(P(t, T.hook, T.hook + .7)), k2 = spring(P(t, T.hook + .12, T.hook + .82)), k3 = spring(P(t, T.hook + .24, T.hook + .94));
  g.globalAlpha = a; g.save(); g.translate(60, 210); g.scale(k1, k1); g.fillText('JANGAN', 0, 0); g.restore();
  g.save(); g.translate(60, 400); g.scale(k2, k2); g.fillStyle = WH; g.fillText('BELI', 0, 0); g.restore();
  g.save(); g.translate(60, 590); g.scale(k3, k3); g.fillStyle = WH; g.fillText('SAMBAL NI.', 0, 0); g.restore();
  const l2 = P(t, T.line2, T.line2 + .5); if (l2 > 0) { g.globalAlpha = eo(l2); g.font = 'italic 64px ISerif'; g.fillStyle = WH; g.fillText('...kalau tak tahan pedas.', 64, 740 + (1 - eo(l2)) * 20); }
  g.restore();
}
function ldType(g, ox, oy, t) {
  g.save(); g.translate(ox, oy + HEAD); const u = P(t, T.cta + .5, T.cta + 1.0);
  g.globalAlpha = eo(u); g.fillStyle = LAV; g.font = '500 30px Grot'; g.letterSpacing = '6px'; g.fillText('LOKADIGITAL', 64, 150); g.letterSpacing = '0px';
  g.fillStyle = WH; g.font = 'italic 92px ISerif'; g.fillText('Kami tulis 3 saat', 64, 330); g.fillText('pertama itu', 64, 430); g.fillStyle = Y; g.fillText('untuk anda.', 64, 530);
  const v = P(t, T.cta + 1.4, T.cta + 1.8); if (v > 0) { const s = back(v, 2); g.save(); g.translate(64, 640); g.scale(s, s); g.globalAlpha = Math.min(1, v * 3);
    rr(g, 0, 0, 640, 120, 60); g.fillStyle = Y; g.fill(); g.fillStyle = INK; g.font = '76px Anton'; g.fillText('DM LOKADIGITAL', 44, 92); g.restore(); }
  g.restore();
}

// ---------- character performance
function perf(t) {
  const e = {}; let blink = .32, eyeX = 0, eyeY = -.85, tilt = .035, lean = 0, yaw = 0;
  const bored = 1 - P(t, T.hook, T.hook + .12);
  e.neutral = .6 * bored; e.skeptical = 0;
  // bored blinks + eye darts that follow the scroll
  for (const b of [1.4, 3.9, 6.0]) { const u = P(t, b, b + .24); if (u > 0 && u < 1) blink = Math.max(blink, Math.sin(u * Math.PI)); }
  for (const s of [T.swipe1, T.swipe2]) { const u = P(t, s, s + .4); eyeY += Math.sin(u * Math.PI) * .5; }
  eyeX = Math.sin(t * .9) * .15 * bored;
  if (t > T.flick && t < T.hook) { eyeY += Math.sin(t * 30) * .12; blink = .45; }
  // THE STOP
  const s = P(t, T.hook, T.hook + .18), stay = 1 - P(t, T.line2 + .2, T.line2 + .6);
  if (s > 0) { e.surprised = s * (.6 + .4 * stay); blink = lerp(blink, 0, s); lean = eo(P(t, T.hook + .05, T.hook + .6)); eyeY = -.95; eyeX = 0; tilt = lerp(.035, -.02, s); }
  const th = P(t, T.line2, T.line2 + .4) * (1 - P(t, T.smirk, T.smirk + .3)); if (th > 0) { e.focused = th * .7; }
  const sm = P(t, T.smirk, T.smirk + .35); if (sm > 0) { e.smirk = sm * (1 - P(t, T.smirk + .9, T.smirk + 1.3)); e.smile = 1.5 * P(t, T.smirk + .9, T.smirk + 1.3); e.smirk += .5 * P(t, T.smirk + .9, T.smirk + 1.3); }
  for (const b of [11.0, 15.2, 19.1, 22.4]) { const u = P(t, b, b + .2); if (u > 0 && u < 1) blink = Math.max(blink, Math.sin(u * Math.PI)); }
  if (t > T.freeze) { eyeY = lerp(-.95, 0, eo(P(t, T.freeze, T.freeze + .5))); eyeX = lerp(0, .25, eo(P(t, T.freeze, T.freeze + .5))); }   // looks to camera during the breakdown
  if (t > T.cta) { eyeY = lerp(eyeY, -.6, eo(P(t, T.cta, T.cta + .4))) + .6 * eo(P(t, T.cta + 1.6, T.cta + 2.0)); eyeX = lerp(eyeX, 0, eo(P(t, T.cta, T.cta + .4))); e.smile = 1.5; e.smirk = .6; tilt = -.02 + Math.sin(P(t, T.cta + 1.6, T.cta + 2.6) * Math.PI * 2) * .03; }
  return { e, blink, eyeX, eyeY, tilt, lean, yaw };
}

window.renderFrame = (t, f) => {

  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none'; x.fillStyle = INK; x.fillRect(0, 0, W, H);
  const sc = scroll(tf), vel = (scroll(tf) - scroll(tf - 1 / 30)) * POST_H;          // px per frame
  const curIdx = Math.max(0, Math.min(LDI, Math.round(sc)));

  fx.setTransform(1, 0, 0, 1, 0, 0); fx.fillStyle = '#0D0A12'; fx.fillRect(0, 0, SW, SH);
  const topY = 74 - sc * POST_H;   // status bar height
  const drawFeed = (dy) => { for (let i = 0; i <= LDI; i++) { const py = topY + i * POST_H + dy; if (py > SH || py + POST_H < 0) continue; fx.drawImage(POSTS[i], 0, py);
      if (i === HOOK) hookType(fx, 0, py, tf); if (i === LDI) ldType(fx, 0, py, tf); } };
  const blurN = Math.min(9, Math.floor(Math.abs(vel) / 14));
  if (blurN > 1) { fx.globalAlpha = 1; drawFeed(0); fx.globalAlpha = 1 / blurN * 1.6; for (let k = 1; k < blurN; k++) drawFeed(-vel * k / blurN * .9); fx.globalAlpha = 1; }
  else drawFeed(0);

  fx.fillStyle = '#0D0A12'; fx.fillRect(0, 0, SW, 74); fx.fillStyle = '#fff'; fx.font = '700 30px Grot'; fx.fillText('21:07', 40, 50);
  fx.fillRect(900, 30, 52, 24); fx.fillStyle = '#0D0A12'; fx.fillRect(904, 34, 30, 16); fx.fillStyle = '#fff'; fx.fillRect(954, 37, 5, 10);

  const settles = [[.3, T.swipe1], [T.swipe1 + .45, T.swipe2], [T.swipe2 + .4, T.flick], [T.hook + .1, 99]];
  let barU = -1, barT0 = 0; for (const [a, b] of settles) if (t >= a && t < b) { barU = (t - a) / 3; barT0 = a; }
  if (barU >= 0 && t < T.freeze + .01 || (t >= T.freeze && t < T.cta)) { if (t >= T.freeze) barU = (T.freeze - (T.hook + .1)) / 3;
    const u = Math.min(1, barU), full = barU >= 1;
    fx.fillStyle = 'rgba(255,255,255,0.18)'; rr(fx, 40, 84, SW - 80, 8, 4); fx.fill();
    fx.fillStyle = full ? Y : '#fff'; rr(fx, 40, 84, (SW - 80) * u, 8, 4); fx.fill();
    fx.font = '700 30px Grot'; fx.fillStyle = full ? Y : 'rgba(255,255,255,0.85)'; fx.textAlign = 'center'; fx.fillText(full ? '3 SAAT ✓' : (Math.min(barU, 1) * 3).toFixed(1) + 's', SW / 2, 50); fx.textAlign = 'left'; }
  // touch indicator for swipes

  const base = new THREE.Color('#BFC8E8'); const mixc = base.clone().lerp(lc, .35);
  const flash = t > T.hook ? Math.exp(-(t - T.hook) * 3) * .25 : 0;

  if (fz > 0) { x.fillStyle = `rgba(5,3,10,${fz * .45})`; x.fillRect(0, CAM_Y, W, H - CAM_Y); }
  x.restore();
  // ================= BREAKDOWN TYPOGRAPHY
  x.textAlign = 'left';
  const bA = P(t, T.big, T.big + .3) * (1 - P(t, T.anat - .3, T.anat));
  if (bA > 0) { x.save(); x.globalAlpha = bA; x.fillStyle = WH; x.font = 'italic 110px ISerif'; x.fillText('Anda cuma ada', 80, 1330 + (1 - eo(P(t, T.big, T.big + .4))) * 30);
    const u = P(t, T.big + .5, T.big + 1.1); const s = spring(u); x.save(); x.translate(80, 1640); x.scale(s, s); x.fillStyle = Y; x.font = '330px Anton'; x.fillText('3 SAAT.', 0, 0); x.restore();
    x.globalAlpha = bA * P(t, T.big + 1.4, T.big + 1.8); x.fillStyle = LAV; x.font = '500 34px Grot'; x.fillText('Sebelum ibu jari bergerak.', 86, 1730); x.restore(); }
  // anatomy: three callouts from hook text (phone) down into the cam region

  if (aA > 0) { const items = [['01', 'Lawan jangkaan', 'Jangan beli?'], ['02', 'Satu benda spesifik', 'Sambal. Bukan "produk kami".'], ['03', 'Cabar penonton', 'Tahan pedas atau tidak?']];
    // targets on screen: line positions in the frozen phone (screen coords)

      x.save(); x.globalAlpha = aA * eo(u); x.strokeStyle = Y; x.fillStyle = Y; x.lineWidth = 4; const [ux0, ux1, uy] = UL[i]; const e = eo(u);

      x.beginPath(); x.moveTo(96, yy - 14); x.lineTo(58, yy - 14); x.lineTo(58, lerp(yy - 14, uy + 4, e)); x.lineTo(lerp(58, ux0, e), lerp(yy - 14, uy + 4, e)); x.stroke();

  const rA = P(t, T.rule, T.rule + .3) * (1 - P(t, T.cta - .3, T.cta));
  if (rA > 0) { x.save(); x.globalAlpha = rA; x.fillStyle = WH; x.font = 'italic 120px ISerif'; x.fillText('Hook dulu.', 80, 1420 + (1 - eo(P(t, T.rule, T.rule + .4))) * 30);
    x.globalAlpha = rA * P(t, T.rule + .5, T.rule + .8); x.fillStyle = Y; x.font = '150px Anton'; x.fillText('BARU CERITA.', 80, 1600); x.restore(); }

  x.setTransform(1, 0, 0, 1, 0, 0);
  const v = x.createRadialGradient(W / 2, H / 2, H * .35, W / 2, H / 2, H * .75); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.35)'); x.fillStyle = v; x.fillRect(0, 0, W, H);

  const fi = 1 - P(t, 0, .15), fo = P(t, 23.6, 24); if (fi > 0 || fo > 0) { x.fillStyle = `rgba(5,3,10,${Math.max(fi, fo)})`; x.fillRect(0, 0, W, H); }
};
