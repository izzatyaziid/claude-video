<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Anton";src:url(../../../../../LOKACREATIVE_STANDARD/_shared/fonts/anton-latin-400-normal.woff2)}
@font-face{font-family:"ISerif";font-style:italic;src:url(../../../../../LOKACREATIVE_STANDARD/_shared/fonts/instrument-serif-latin-400-italic.woff2)}
@font-face{font-family:"ISerif";src:url(../../../../../LOKACREATIVE_STANDARD/_shared/fonts/instrument-serif-latin-400-normal.woff2)}

html,body{margin:0;background:#05030A}canvas{display:block}</style></head><body>
<canvas id="out" width="1080" height="1920"></canvas>
<script type="module">
// LOKADIGITAL · V3 "VIRAL ≠ STRATEGI" · real-time 3D extruded type, studio light, rigid-body topple · 22 s · no voiceover
import * as THREE from '../../../SAMPLES/_engine/vendor/three.module.js';
import { RoomEnvironment } from '../../../SAMPLES/_engine/vendor/RoomEnvironment.js';
import { parse } from '../../../SAMPLES/_engine/vendor/opentype.module.js';
const W = 1080, H = 1920, Y = '#E8FF2B', LAV = '#AB94FF', WH = '#F4F1FF';
const cl = v => Math.max(0, Math.min(1, v)), P = (t, a, b) => cl((t - a) / (b - a)), lerp = (a, b, u) => a + (b - a) * u;
const eo = v => 1 - Math.pow(1 - cl(v), 3), eio = v => { v = cl(v); return v < .5 ? 4 * v * v * v : 1 - Math.pow(-2 * v + 2, 3) / 2; };
const back = (v, s = 1.4) => { v = cl(v); return 1 + (s + 1) * Math.pow(v - 1, 3) + s * Math.pow(v - 1, 2); };
function rng(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let q = Math.imul(s ^ s >>> 15, 1 | s); q = q + Math.imul(q ^ q >>> 7, 61 | q) ^ q; return ((q ^ q >>> 14) >>> 0) / 4294967296; }; }

// ---------- timeline
const FALL = [4.55, 4.85, 5.08, 5.26, 5.40];          // V I R A L topple starts
const STEP0 = 7.3, STEPGAP = .78;                     // stairs rise
const T = { t1: .5, t2: 6.6, t3: 9.4, climb: 11.4, crane: 15.0, cta: 17.4, end: 22 };
const WORDS = ['CONTENT', 'TEST', 'MENANG', 'ADS', 'SCALE'];
const SUB = ['buat', 'uji', 'pilih', 'labur', 'besarkan'];
const STEP_D = .78, STEP_H = .52, STEP_W = 3.4, ZS = -1.95;

let out, x, glc, R, scene, cam, font, letters = [], steps = [], dust, dustGeo, grainC = [];
const DUSTN = 60;

function glyphShapes(ch, size) {
  const path = font.getPath(ch, 0, 0, size); const sp = new THREE.ShapePath();
  for (const c of path.commands) {
    if (c.type === 'M') sp.moveTo(c.x, -c.y); else if (c.type === 'L') sp.lineTo(c.x, -c.y);
    else if (c.type === 'C') sp.bezierCurveTo(c.x1, -c.y1, c.x2, -c.y2, c.x, -c.y); else if (c.type === 'Q') sp.quadraticCurveTo(c.x1, -c.y1, c.x, -c.y);
  }
  return sp.toShapes(true);
}
function textGeo(str, size, depth, bevel) {
  const shapes = []; let adv = 0; const sc = size / font.unitsPerEm;
  for (const ch of str) { const g = font.charToGlyph(ch); glyphShapes(ch, size).forEach(s => { s.userData = { dx: adv }; shapes.push([s, adv]); }); adv += g.advanceWidth * sc; }
  const geos = shapes.map(([s, dx]) => { const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * .8, bevelSegments: 3, curveSegments: 8 }); g.translate(dx, 0, 0); return g; });
  return { geos, width: adv };
}
function merge(geos) { // minimal merge (positions/normals/uvs, non-indexed)
  const ng = geos.map(g => g.index ? g.toNonIndexed() : g); let n = 0; ng.forEach(g => n += g.attributes.position.count);
  const out = new THREE.BufferGeometry(); for (const a of ['position', 'normal', 'uv']) { const sz = ng[0].attributes[a].itemSize; const arr = new Float32Array(n * sz); let o = 0; ng.forEach(g => { arr.set(g.attributes[a].array, o); o += g.attributes[a].array.length; }); out.setAttribute(a, new THREE.BufferAttribute(arr, sz)); }
  return out;
}

window.init = async () => {
  for (const f of ['64px Anton', 'italic 64px ISerif', '64px ISerif', '500 20px DMMono']) await document.fonts.load(f);
  out = document.getElementById('out'); x = out.getContext('2d');
  font = parse(await (await fetch('InterDisplay-Black.otf')).arrayBuffer());
  glc = document.createElement('canvas'); glc.width = W; glc.height = H;
  R = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true }); R.setSize(W, H, false); R.setPixelRatio(1);
  R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.toneMapping = THREE.NoToneMapping; R.outputColorSpace = THREE.SRGBColorSpace;
  scene = new THREE.Scene(); scene.background = new THREE.Color('#05030A'); scene.fog = new THREE.Fog('#05030A', 11, 26);
  const pm = new THREE.PMREMGenerator(R); scene.environment = pm.fromScene(new RoomEnvironment(), .04).texture; scene.environmentIntensity = .22;
  cam = new THREE.PerspectiveCamera(34, W / H, .05, 60);
  // lights: one hard key from high front-left, electric-yellow rim from behind-right, purple fill
  scene.add(new THREE.HemisphereLight('#3a1d8a', '#05030A', .45));
  const key = new THREE.SpotLight('#efeaff', 70, 0, .42, .55, 1.6); key.position.set(-3.2, 7.5, 4.5); key.target.position.set(0, 0, -1.2); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -.0004; key.shadow.radius = 4; key.shadow.camera.near = 2; key.shadow.camera.far = 20; scene.add(key, key.target);
  const rim = new THREE.DirectionalLight('#E8FF2B', 3.2); rim.position.set(5, .5, -6); scene.add(rim);
  const fill = new THREE.PointLight('#7B4DFF', 18, 12, 1.5); fill.position.set(-5, 1.6, 1.5); scene.add(fill);
  // floor: dark polished concrete
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshStandardMaterial({ color: '#07050d', roughness: .88, metalness: 0 }));
  fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; scene.add(fl);
  // VIRAL — 5 rigid letters, pivot at bottom-BACK edge so they topple away from camera and land face-up
  const size = 1.12, depth = .32; let adv = 0; const sc = size / font.unitsPerEm; const word = 'VIRAL';
  const total = [...word].reduce((a, c) => a + font.charToGlyph(c).advanceWidth * sc, 0) + .06 * 4;
  const mat = new THREE.MeshPhysicalMaterial({ color: '#2a1659', roughness: .28, metalness: .1, clearcoat: .8, clearcoatRoughness: .2 });
  for (const ch of word) { const gw = font.charToGlyph(ch).advanceWidth * sc;
    const g = merge(glyphShapes(ch, size).map(s => new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: .03, bevelSize: .022, bevelSegments: 3, curveSegments: 10 })));
    g.computeBoundingBox(); const bb = g.boundingBox; g.translate(-(bb.min.x + bb.max.x) / 2, -bb.min.y + .0, -bb.min.z); // x-centred, bottom at y=0, back at z=0
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, mat); m.castShadow = m.receiveShadow = true; const piv = new THREE.Group(); piv.add(m);
    piv.position.set(-total / 2 + adv + gw / 2, 0, -(bb.max.z - bb.min.z)); scene.add(piv);
    letters.push({ piv, h: bb.max.y - bb.min.y, d: bb.max.z - bb.min.z }); adv += gw + .06; }
  // STAIRS — solid blocks that grind up out of the floor; each riser carries its word in raised type
  const stoneM = new THREE.MeshStandardMaterial({ color: '#17121f', roughness: .78, metalness: .05 });
  const wordM = new THREE.MeshStandardMaterial({ color: '#F4F1FF', roughness: .35, metalness: .0, emissive: '#ffffff', emissiveIntensity: .05 });
  const goldM = new THREE.MeshStandardMaterial({ color: '#E8FF2B', roughness: .3, emissive: '#E8FF2B', emissiveIntensity: .7 });
  WORDS.forEach((w, i) => { const grp = new THREE.Group(); const hgt = (i + 1) * STEP_H;
    const box = new THREE.Mesh(new THREE.BoxGeometry(STEP_W, hgt, STEP_D), stoneM); box.position.set(0, hgt / 2, -STEP_D / 2); box.castShadow = box.receiveShadow = true; grp.add(box);
    // edge highlight strip (machined nosing)
    const nose = new THREE.Mesh(new THREE.BoxGeometry(STEP_W, .018, .018), i === 4 ? goldM : new THREE.MeshStandardMaterial({ color: '#5b4a86', roughness: .4 })); nose.position.set(0, hgt, 0); grp.add(nose);
    const { geos, width } = textGeo(w, .3, .05, .006); const tg = merge(geos); tg.computeVertexNormals();
    const tm = new THREE.Mesh(tg, i === 4 ? goldM : wordM); tm.position.set(-width / 2, hgt - STEP_H / 2 - .11, 0); tm.castShadow = true; grp.add(tm);
    grp.position.set(0, 0, ZS - i * STEP_D); scene.add(grp); steps.push({ grp, hgt }); });
  // dust (impact puffs) as soft points
  const dc = document.createElement('canvas'); dc.width = dc.height = 64; const dg = dc.getContext('2d'); const rg = dg.createRadialGradient(32, 32, 0, 32, 32, 32); rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(1, 'rgba(255,255,255,0)'); dg.fillStyle = rg; dg.fillRect(0, 0, 64, 64);
  dustGeo = new THREE.BufferGeometry(); dustGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(DUSTN * 5 * 3), 3));
  dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: .09, map: new THREE.CanvasTexture(dc), transparent: true, opacity: .35, depthWrite: false, color: '#b9aee0' })); scene.add(dust);
  for (let k = 0; k < 4; k++) { const c = document.createElement('canvas'); c.width = 540; c.height = 960; const q = c.getContext('2d'); const d = q.createImageData(540, 960); const r = rng(90 + k); for (let i = 0; i < d.data.length; i += 4) { const v = 128 + (r() + r() - 1) * 80; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 255; } q.putImageData(d, 0, 0); grainC.push(c); }
};

// ---------- rigid topple: θ'' = (3g / 2h)·sin θ  (block pivoting on its edge), restitution on floor contact
function topple(t, t0, h) {
  if (t < t0) return { th: Math.sin(Math.max(0, t - 4.0) * 26) * .012 * P(t, 4.0, 4.2), hit: [] };
  let th = .05, w = 0; const k = 3 * 9.8 / (2 * h) * .55, dt = 1 / 1200, hits = []; let tt = t0;
  while (tt < t) { w += k * Math.sin(th) * dt; th += w * dt; if (th >= Math.PI / 2) { th = Math.PI / 2; if (Math.abs(w) > .4) hits.push([tt, w]); w = -w * .22; } tt += dt; }
  return { th, hit: hits };
}

function camAt(t) {
  const K = [ // [time, pos, target]
    [0, [0.15, .45, 9.4], [0, .62, 0]], [4.2, [.05, .5, 6.4], [0, .55, -.1]],
    [6.3, [.3, 1.9, 6.6], [0, .2, -.7]], [7.2, [2.6, 2.6, 6.6], [0, 1.1, -2.4]],
    [11.0, [3.2, 2.8, 5.2], [0, 1.4, -2.8]], [13.2, [2.4, 2.4, 1.6], [0, 1.9, -3.4]],
    [15.0, [1.5, 3.6, -.6], [0, 2.7, -4.4]], [17.2, [.3, 9.4, 6.4], [0, .3, -2.9]], [22, [.2, 9.9, 7.0], [0, .3, -3.0]]];
  let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
  const [ta, pa, la] = K[i], [tb, pb, lb] = K[i + 1]; const u = eio(P(t, ta, tb));
  const v = (a, b) => new THREE.Vector3(lerp(a[0], b[0], u), lerp(a[1], b[1], u), lerp(a[2], b[2], u));
  return [v(pa, pb), v(la, lb)];
}

window.renderFrame = (t, f) => {
  // letters
  let shake = 0; const dpos = dustGeo.attributes.position.array; dpos.fill(0); const r0 = rng(7);
  letters.forEach((L, i) => { const { th, hit } = topple(t, FALL[i], L.h); L.piv.rotation.x = -th;
    hit.forEach(([ht, w]) => { const a = t - ht; if (a >= 0 && a < .5) shake = Math.max(shake, (1 - a / .5) * Math.min(1, Math.abs(w) / 4) * .02); });
    if (hit.length) { const ht = hit[0][0], a = t - ht; const r = rng(30 + i);
      for (let k = 0; k < DUSTN; k++) { const ang = r() * Math.PI * 2, sp = .3 + r() * .9, up = .15 + r() * .5; const o = (i * DUSTN + k) * 3;
        if (a > 0 && a < 2.2) { const dr = (1 - Math.exp(-a * 2.4)) / 2.4; dpos[o] = L.piv.position.x + (r() - .5) * .7 + Math.cos(ang) * sp * dr; dpos[o + 1] = .02 + up * dr * 1.2 - .02 * a; dpos[o + 2] = L.piv.position.z - L.h * (.3 + r() * .7) + Math.sin(ang) * sp * dr; }
        else { dpos[o + 1] = -5; } } } else { for (let k = 0; k < DUSTN; k++) dpos[(i * DUSTN + k) * 3 + 1] = -5; } });
  dustGeo.attributes.position.needsUpdate = true; dust.material.opacity = .35 * (1 - P(t, 7, 8.5));
  // stairs grind up
  steps.forEach((S, i) => { const t0 = STEP0 + i * STEPGAP, u = P(t, t0, t0 + .62); S.grp.position.y = -S.hgt * (1 - back(u, .9)) - (u <= 0 ? .2 : 0); S.grp.visible = u > 0; });
  // camera
  const [pos, tgt] = camAt(t); const r = rng(Math.floor(t * 30) + 3);
  const hand = new THREE.Vector3(Math.sin(t * 1.1) * .012 + (r() - .5) * shake, Math.sin(t * .8) * .01 + (r() - .5) * shake, 0);
  cam.position.copy(pos).add(hand); cam.lookAt(tgt); cam.fov = lerp(40, 36, eio(P(t, 7.2, 11))) + 4 * eio(P(t, 15, 17.2)); cam.updateProjectionMatrix();
  R.render(scene, cam);
  // ---------- compose + 2D typography
  x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.drawImage(glc, 0, 0);
  const plate = (y0, y1, a) => { const g = x.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, `rgba(5,3,10,${.0})`); g.addColorStop(.3, `rgba(5,3,10,${.55 * a})`); g.addColorStop(1, `rgba(5,3,10,0)`); x.fillStyle = g; x.fillRect(0, y0, W, y1 - y0); };
  const say = (s, X, Yp, size, t0, t1, o = {}) => { const a = P(t, t0, t0 + .45) * (1 - P(t, t1 - .35, t1)); if (a <= 0) return; x.save(); x.globalAlpha = a; x.font = o.font || `italic ${size}px ISerif`; x.fillStyle = o.col || WH; x.textAlign = o.align || 'left';
    x.fillText(s, X, Yp + (1 - eo(P(t, t0, t0 + .6))) * 26); x.restore(); };
  plate(140, 620, P(t, .3, .8) * (1 - P(t, T.cta + 3.5, 22)));
  x.save(); x.globalAlpha = P(t, .3, .8) * (1 - P(t, 3.8, 4.2)); x.font = '500 24px DMMono'; x.letterSpacing = '8px'; x.fillStyle = LAV; x.fillText('LOKADIGITAL', 90, 250); x.restore();
  say('Semua orang', 90, 360, 104, T.t1, 4.2); say('nak viral.', 90, 460, 104, T.t1 + .35, 4.2);
  say('Viral itu nasib.', 90, 400, 112, T.t2, 9.2);
  say('Strategi itu', 90, 380, 108, T.t3, 13.6); say('tangga.', 90, 490, 108, T.t3 + .4, 13.6, { col: Y });
  // step sub-labels near camera climb (mono, small): appear as each riser is passed
  if (t > T.climb && t < T.crane + .3) { x.save(); x.font = '500 26px DMMono'; x.letterSpacing = '5px';
    WORDS.forEach((w, i) => { const tt0 = 13.7 + i * .25; const a = P(t, tt0, tt0 + .3) * (1 - P(t, T.crane, T.crane + .3)); if (a <= 0) return; x.globalAlpha = a; x.fillStyle = i === 4 ? Y : LAV; x.fillText(`0${i + 1}  ${SUB[i].toUpperCase()}`, 90, 470 - i * 52); }); x.restore(); }
  // CTA
  const ca = P(t, T.cta, T.cta + .5);
  if (ca > 0) { const g = x.createLinearGradient(0, 1180, 0, 1920); g.addColorStop(0, 'rgba(5,3,10,0)'); g.addColorStop(.35, `rgba(5,3,10,${.8 * ca})`); g.addColorStop(1, `rgba(5,3,10,${.92 * ca})`); x.fillStyle = g; x.fillRect(0, 1180, W, 740);
    say('Jangan tunggu nasib.', 90, 1430, 92, T.cta + .1, 30); say('Bina tangganya.', 90, 1530, 92, T.cta + .6, 30, { col: Y });
    const v = P(t, T.cta + 1.5, T.cta + 1.9); if (v > 0) { const s = back(v, 2); x.save(); x.translate(90, 1610); x.scale(s, s); x.globalAlpha = Math.min(1, v * 3);
      x.beginPath(); x.roundRect(0, 0, 660, 124, 62); x.fillStyle = Y; x.fill(); x.fillStyle = '#05030A'; x.font = '80px Anton'; x.fillText('DM LOKADIGITAL', 46, 96); x.restore(); }
    x.save(); x.globalAlpha = P(t, T.cta + 2.3, T.cta + 2.8); x.font = '500 22px DMMono'; x.letterSpacing = '6px'; x.fillStyle = LAV; x.fillText('CONTENT · TEST · ADS · SCALE', 92, 1800); x.restore(); }
  // finish: letterbox-free vignette, grain, bloom-ish lift on yellow via screen glow is in-scene (emissive)
  const vg = x.createRadialGradient(W / 2, H * .5, H * .3, W / 2, H * .5, H * .78); vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.5)'); x.fillStyle = vg; x.fillRect(0, 0, W, H);
  x.save(); x.globalCompositeOperation = 'overlay'; x.globalAlpha = .08; x.drawImage(grainC[(f || 0) % 4], 0, 0, W, H); x.restore();
  const fi = 1 - P(t, 0, .4), fo = P(t, 21.5, 22); if (fi > 0 || fo > 0) { x.fillStyle = `rgba(5,3,10,${Math.max(fi, fo)})`; x.fillRect(0, 0, W, H); }
};
</script></body></html>
